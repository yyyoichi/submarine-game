version: v2
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/gen
    opt: paths=source_relative

  - local: protoc-gen-es
    out: web/app/gen
    opt: target=ts
  - local: protoc-gen-connect-es
    out: web/app/gen
    opt: target=ts